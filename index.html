<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0F172A">
<title>MineDodge</title>
<!-- Красивая иконка сайта (бомба) -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='45' cy='55' r='30' fill='%231E293B'/%3E%3Ccircle cx='35' cy='45' r='10' fill='%23fff' opacity='0.15'/%3E%3Cpath d='M 48 22 Q 65 10, 75 25' stroke='%23A16207' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='75' cy='25' r='6' fill='%23FDE047'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0F172A; --panel:#1E293B; --card:#334155;
    --white:#F8FAFC; --gray:#94A3B8;
    --blue:#3B82F6; --orange:#F97316; --green:#10B981; --red:#EF4444;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{max-width:100%; overflow-x:hidden;}
  body{
    margin:0; background:var(--bg); color:var(--white);
    font-family:"Segoe UI", system-ui, -apple-system, sans-serif;
    display:flex; gap:15px; padding:15px;
    min-height:100vh; justify-content:center; align-items:flex-start;
    touch-action:manipulation;
    position: relative; z-index: 1;
  }

  /* Космический фон */
  #space-canvas {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    z-index: -1;
    pointer-events: none;
  }

  .left{width:360px; flex-shrink:0; background:var(--panel); border-radius:15px; padding:12px;}
  .right{flex:1; max-width:640px; min-width:0; display:flex; flex-direction:column; gap:15px;}

  /* Заголовок с бомбой */
  h1{
    margin:10px 0 15px; text-align:center; font-size:40px; letter-spacing:.5px;
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }

  .title-bomb {
    width: 50px; height: 50px;
    filter: drop-shadow(0 0 10px rgba(249, 115, 22, 0.5));
  }

  @keyframes spark {
    0% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.3); opacity: 1; filter: brightness(1.5); }
    100% { transform: scale(1); opacity: 0.8; }
  }
  .spark { transform-origin: 75px 25px; animation: spark 0.15s infinite alternate; }

  /* Блок Ставки и Баланса (Компактный) */
  .bet-card { padding: 6px 10px; margin-bottom: 6px; }
  .bet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0px; }
  .bet-header .title { margin: 0; }
  .balance-box { background: transparent; padding: 0; text-align: right; }
  .balance-box .lbl { font-size: 10px; font-weight:700; color:var(--gray); letter-spacing:1px; }
  .balance-box .val { font-size: 20px; font-weight: 800; color: var(--green); line-height: 1.1; }

  .card{background:var(--card); border-radius:10px; padding:8px 12px; margin-bottom:8px;}
  .card .title{font-size:11px; font-weight:700; color:var(--gray); letter-spacing:1px;}

  input[type=number]{
    width:100%; background:transparent; border:none; outline:none;
    color:var(--white); font-size:18px; font-weight:800; padding:0;
    font-family:inherit;
  }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}

  .row{display:flex; gap:4px; margin-top:4px;}
  .row .btn { min-height: 30px; padding: 4px; font-size: 12px; }
  
  .btn{
    flex:1; border:none; border-radius:8px; background:#475569; color:var(--white);
    font-family:inherit; font-weight:700; font-size:13px; cursor:pointer;
    padding:8px 4px; transition:background .15s, transform .1s;
    user-select:none; min-height:38px;
  }
  .btn:hover:not(:disabled){background:#64748B;}
  .btn:active:not(:disabled){transform:scale(.97);}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn.blue{background:var(--blue);} .btn.blue:hover:not(:disabled){background:#2563EB;}
  .btn.green{background:var(--green);} .btn.green:hover:not(:disabled){background:#059669;}

  /* CSS Grid для кнопок мин — исключает наезжание */
  .mines-row{
    display: grid; 
    grid-template-columns: repeat(5, 1fr); 
    gap: 4px; 
    margin-top: 6px;
  }
  .mines-input{
    display: grid; 
    grid-template-columns: repeat(3, 1fr); 
    gap: 2px;
  }
  .mines-input .btn{
    width: 100%; padding: 0; min-height: 38px;
    background: var(--bg); border-radius: 8px;
    border: 1px solid #475569;
    display: flex; align-items: center; justify-content: center;
  }
  .mines-input .val{display: flex; align-items: center; justify-content: center; font-size:16px; font-weight:800; color:var(--orange);}

  .actions{display:flex; gap:8px; margin:4px 0 8px;}
  .actions .btn{padding:10px 4px; font-size:15px; min-height:42px;}
  .actions .auto{flex:0 0 70px; font-size:13px;}

  /* Блок Информации и Истории */
  .info{background:var(--card); border-radius:10px; padding:10px; flex:1; display: flex; flex-direction: column;}
  .info-left, .info-right { display: flex; flex-direction: column; min-width: 0; }
  .info .h{font-size:12px; font-weight:700; letter-spacing:.5px; margin:0 0 6px 0;}
  .info .result{font-size:16px; font-weight:800; color:var(--gray); margin-bottom:6px;}
  .info .stat{font-size:12px; margin:3px 0; display:flex; align-items:center; gap:6px;}
  .info .stat svg{width:14px; height:14px; flex-shrink:0;}

  /* История: жестко фиксируем высоту, чтобы не растягивалась */
  .history{
    background:var(--bg); border-radius:8px; padding:6px 8px;
    height: 140px; /* Фиксированная высота */
    flex: none;   /* Запрещаем растягиваться */
    overflow-y: auto; /* Включаем внутренний скролл */
    font-family: Arial, sans-serif; font-size:13px;
    white-space:nowrap; margin-top: 4px;
  }
  .history .item{display:flex; align-items:center; gap:6px; padding:4px 0; font-weight: 700;}
  .history .item svg{width:16px; height:16px; flex-shrink:0;}

  .mult{background:var(--panel); border-radius:15px; padding:8px;
        display:flex; gap:5px; justify-content:center; flex-wrap:nowrap;}
  .mult .m{
    flex:1; min-width:0; text-align:center; padding:7px 2px; border-radius:8px;
    background:var(--bg); color:var(--orange); font-weight:800; font-size:13px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    transition:background .15s, color .15s;
  }
  .mult .m.done{background:var(--green); color:#fff;}
  .mult .m.current{background:var(--orange); color:#fff;}

  .stats{background:var(--panel); border-radius:15px; padding:10px; display:flex;}
  .stats > div{flex:1; text-align:center; font-weight:800; font-size:14px; line-height:1.4;}
  .stats .gray{color:var(--gray);} .stats .green{color:var(--green);} .stats .orange{color:var(--orange);}

  .field{
    background:var(--panel); border-radius:25px; border:3px solid var(--orange);
    padding:15px; align-self:center; max-width:100%;
  }
  .grid{display:grid; grid-template-columns:repeat(5, 70px); gap:8px;}
  .cell{
    width:70px; height:70px; border-radius:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:transform .1s; position:relative; overflow:hidden;
  }
  .cell:active:not(.dead):not(.safe){transform:scale(.95);}
  .cell svg{width:100%; height:100%; display:block;}
  .cell.safe svg, .cell.dead svg{animation:pop .25s ease-out;}
  @keyframes pop{
    0%{transform:scale(.6); opacity:.4;}
    100%{transform:scale(1); opacity:1;}
  }
  .cell.dead{cursor:default;} .cell.safe{cursor:default;}

  /* ============================================================= */
  /* ПЛАНШЕТ: 700–1100px                                            */
  /* ============================================================= */
  @media (max-width:1100px){
    .left{width:300px;}
    h1{font-size:34px;}
    .title-bomb { width: 44px; height: 44px; }
    .grid{grid-template-columns:repeat(5, 58px); gap:6px;}
    .cell{width:58px; height:58px; border-radius:12px;}
  }

  /* ============================================================= */
  /* ТЕЛЕФОН: <700px                                                */
  /* ============================================================= */
  @media (max-width:700px){
    body {
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
      padding: 10px;
      padding-top: 15px;
    }

    .left, .right { display: contents; }

    /* Порядок элементов */
    h1 { order: 1; margin: 0 0 10px 0; font-size: 36px; }
    .title-bomb { width: 46px; height: 46px; }
    .mult { order: 2; padding: 6px; gap: 4px; }
    .stats { order: 3; padding: 8px; }
    
    /* Поле на телефоне */
    .field { order: 4; padding: 8px; border-radius: 18px; width: 100%; max-width: 340px; margin: 0 auto; }
    .grid { grid-template-columns: repeat(5, 1fr); gap: 5px; width: 100%; }
    .cell { width: 100%; height: auto; aspect-ratio: 1/1; border-radius: 10px; }

    .actions { order: 5; margin: 0; gap: 8px; }
    .bet-card { order: 6; margin: 0; border-radius: 12px; padding: 8px 10px; }
    .mines-card { order: 7; margin: 0; border-radius: 12px; padding: 8px 10px; }
    
    /* На телефоне Инфо и История параллельно */
    .info { order: 8; margin: 0; border-radius: 12px; padding: 10px; display: flex; flex-direction: row; gap: 10px;}
    .info-left { flex: 1; }
    .info-right { flex: 1; }
    
    /* Фиксируем высоту истории на телефоне */
    .info .history { 
      margin-top: 0; 
      height: 140px; /* Высота для мобильного */
    }

    .mult .m { font-size: 10.5px; padding: 6px 1px; letter-spacing: -0.2px; }
    .stats > div { font-size: 11px; line-height: 1.3; }
    
    .actions .btn { min-height: 44px; font-size: 15px; border-radius: 10px; padding: 8px 4px; }
    .actions .auto { flex: 0 0 70px; font-size: 13px; }

    .balance-box .val { font-size: 20px; }
    .btn { min-height: 40px; font-size: 13px; }
    input[type=number] { font-size: 20px; }
  }

  @media (max-width:380px){
    body{padding:8px;}
    h1{font-size:30px;}
    .title-bomb { width: 38px; height: 38px; }
    .mult .m{font-size:9.5px; padding:5px 0;}
    .stats > div{font-size:10px;}
    .actions .auto{flex:0 0 60px;}
  }
</style>
</head>
<body>

<!-- Космический фон -->
<canvas id="space-canvas"></canvas>

<!-- ЛЕВАЯ ПАНЕЛЬ (управление) -->
<div class="left">
  <h1>
    <svg class="title-bomb" viewBox="0 0 100 100">
      <defs>
        <radialGradient id="bombGrad" cx="35%" cy="35%" r="65%">
          <stop offset="0%" stop-color="#475569"/>
          <stop offset="100%" stop-color="#0F172A"/>
        </radialGradient>
        <linearGradient id="fuseGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#A16207"/>
          <stop offset="100%" stop-color="#78350F"/>
        </linearGradient>
        <radialGradient id="sparkGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#FFF"/>
          <stop offset="40%" stop-color="#FDE047"/>
          <stop offset="100%" stop-color="#EA580C"/>
        </radialGradient>
      </defs>
      <circle cx="45" cy="55" r="30" fill="url(#bombGrad)"/>
      <ellipse cx="35" cy="45" rx="10" ry="6" transform="rotate(-30 35 45)" fill="#fff" opacity="0.15"/>
      <path d="M 38 25 L 52 25 L 50 32 L 40 32 Z" fill="#1E293B"/>
      <rect x="40" y="20" width="10" height="6" rx="2" fill="#334155"/>
      <path d="M 48 22 Q 65 10, 75 25" stroke="url(#fuseGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle cx="75" cy="25" r="6" fill="url(#sparkGrad)" class="spark"/>
      <path d="M 75 25 L 80 15 L 78 22 L 85 20 L 79 28 L 82 35 L 74 30 Z" fill="#FDE047" class="spark"/>
    </svg>
    MineDodge
  </h1>

  <!-- Блок Ставки и Баланса -->
  <div class="card bet-card">
    <div class="bet-header">
      <div class="title">СУММА СТАВКИ</div>
      <div class="balance-box">
        <div class="lbl">БАЛАНС</div>
        <div class="val" id="balance">0.00 ₽</div>
      </div>
    </div>
    <input type="number" id="betInput" value="10" step="1" min="1" inputmode="decimal">
    <div class="row">
      <button class="btn" id="btnMin">MIN</button>
      <button class="btn" id="btnHalf">/2</button>
      <button class="btn" id="btnDouble">*2</button>
      <button class="btn" id="btnMax">MAX</button>
    </div>
  </div>

  <div class="card mines-card">
    <div class="title">КОЛИЧЕСТВО МИН</div>
    <div class="mines-row">
      <button class="btn mines-btn" data-m="3">3</button>
      <button class="btn mines-btn" data-m="5">5</button>
      <div class="mines-input">
        <button class="btn" id="mDec">-</button>
        <div class="val" id="minesVal">3</div>
        <button class="btn" id="mInc">+</button>
      </div>
      <button class="btn mines-btn" data-m="10">10</button>
      <button class="btn mines-btn" data-m="20">20</button>
    </div>
  </div>

  <div class="actions">
    <button class="btn blue" id="actionBtn">НАЧАТЬ</button>
    <button class="btn auto" id="autoBtn" disabled>АВТО</button>
  </div>

  <!-- Блок Информации и Истории -->
  <div class="info">
    <div class="info-left">
      <div class="h">ИНФОРМАЦИЯ</div>
      <div class="result" id="resultLabel">Ожидание...</div>
      <div class="stat" id="infoStars"></div>
      <div class="stat" id="infoRisk"></div>
      <div class="stat" id="infoOpened"></div>
    </div>
    <div class="info-right">
      <div class="h">ИСТОРИЯ</div>
      <div class="history" id="history"></div>
    </div>
  </div>
</div>

<!-- ПРАВАЯ ПАНЕЛЬ (поле) -->
<div class="right">
  <div class="mult" id="multRow"></div>

  <div class="stats">
    <div class="gray" id="statBet">ТЕКУЩАЯ СТАВКА<br>0.00 ₽</div>
    <div class="green" id="statWin">ВЫИГРЫШ<br>0.00 ₽</div>
    <div class="orange" id="statNext">СЛЕД. КЕФ<br>x1.00</div>
  </div>

  <div class="field">
    <div class="grid" id="grid"></div>
  </div>
</div>

<script>
// ============ КОСМИЧЕСКИЙ ФОН ============
const canvas = document.getElementById('space-canvas');
const ctx = canvas.getContext('2d');
let width, height;

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const stars = [];
for (let i = 0; i < 150; i++) {
  stars.push({
    x: Math.random() * width,
    y: Math.random() * height,
    size: Math.random() * 1.5 + 0.5,
    vx: (Math.random() - 0.5) * 0.2,
    vy: (Math.random() - 0.5) * 0.2,
    alpha: Math.random(),
    targetAlpha: Math.random(),
    fadeSpeed: 0.002 + Math.random() * 0.005
  });
}

let comets = [];
function spawnComet() {
  if (Math.random() < 0.4) return;
  comets.push({
    x: Math.random() * width,
    y: Math.random() * (height / 2),
    dx: 3 + Math.random() * 4,
    dy: 1 + Math.random() * 2,
    length: 40 + Math.random() * 80,
    life: 100
  });
}
setInterval(spawnComet, 1500);

function animate() {
  ctx.clearRect(0, 0, width, height);

  stars.forEach(s => {
    s.x += s.vx; s.y += s.vy;
    if (s.x < 0) s.x = width; if (s.x > width) s.x = 0;
    if (s.y < 0) s.y = height; if (s.y > height) s.y = 0;

    if (s.alpha < s.targetAlpha) s.alpha += s.fadeSpeed;
    else s.alpha -= s.fadeSpeed;

    if (s.alpha <= 0 || s.alpha >= 1) {
      s.targetAlpha = Math.random();
    }

    ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
  });

  comets.forEach((c, index) => {
    c.x += c.dx; c.y += c.dy; c.life--;
    
    if (c.life <= 0 || c.x > width || c.y > height) {
      comets.splice(index, 1);
      return;
    }

    ctx.beginPath();
    ctx.moveTo(c.x, c.y);
    ctx.lineTo(c.x - c.dx * c.length, c.y - c.dy * c.length);
    
    const grad = ctx.createLinearGradient(c.x, c.y, c.x - c.dx * c.length, c.y - c.dy * c.length);
    grad.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
    grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
    
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.stroke();
  });

  requestAnimationFrame(animate);
}
animate();

// ============ ИГРОВАЯ ЛОГИКА ============
const MIN_BET = 1.0, MAX_BET = 100000.0, INITIAL_BALANCE = 1000.0;
const TOTAL = 25;
const STORAGE_KEY = "minedodge_bet";

const ICONS = {
  hidden: `<svg viewBox="0 0 100 100" aria-hidden="true">
    <defs>
      <linearGradient id="ih" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#2563EB"/>
      </linearGradient>
      <linearGradient id="qGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#E0F2FE"/>
        <stop offset="100%" stop-color="#93C5FD"/>
      </linearGradient>
      <filter id="qShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#1E3A8A" flood-opacity="0.6"/>
      </filter>
    </defs>
    <rect width="100" height="100" rx="16" fill="url(#ih)"/>
    <g transform="translate(50, 50) scale(0.8) translate(-50, -50)">
      <path d="M 33 38 C 33 18, 67 18, 67 38 C 67 52, 50 54, 50 65" fill="none" stroke="url(#qGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#qShadow)"/>
      <circle cx="50" cy="82" r="8" fill="url(#qGrad)" filter="url(#qShadow)"/>
    </g>
  </svg>`,

  star: `<svg viewBox="0 0 100 100" aria-hidden="true">
    <defs><linearGradient id="is" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FB923C"/><stop offset="1" stop-color="#EA580C"/>
    </linearGradient></defs>
    <rect width="100" height="100" rx="16" fill="url(#is)"/>
    <polygon points="50,18 61,40 86,43 67,60 73,85 50,72 27,85 33,60 14,43 39,40"
      fill="#F8FAFC"/>
  </svg>`,

  cross: `<svg viewBox="0 0 100 100" aria-hidden="true">
    <defs><linearGradient id="ic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#2563EB"/>
    </linearGradient></defs>
    <rect width="100" height="100" rx="16" fill="#1E293B"/>
    <g transform="translate(50 50) rotate(45)">
      <rect x="-11" y="-34" width="22" height="68" rx="5" fill="url(#ic)"/>
      <rect x="-34" y="-11" width="68" height="22" rx="5" fill="url(#ic)"/>
      <rect x="-5" y="-25" width="10" height="50" rx="3" fill="#475569"/>
      <rect x="-25" y="-5" width="50" height="10" rx="3" fill="#475569"/>
    </g>
  </svg>`,

  diamond: `<svg viewBox="0 0 24 24" aria-hidden="true">
    <defs><linearGradient id="idm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67E8F9"/><stop offset="1" stop-color="#0891B2"/>
    </linearGradient></defs>
    <path d="M6 3h12l4 6-10 13L2 9z" fill="url(#idm)" stroke="#0E7490" stroke-width="1"/>
    <path d="M6 3l6 6 6-6M2 9h20M12 9v13" stroke="#0E7490" stroke-width="1" fill="none" opacity=".6"/>
  </svg>`,

  bomb: `<svg viewBox="0 0 24 24" aria-hidden="true">
    <defs><radialGradient id="ibg" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#94A3B8"/><stop offset="1" stop-color="#1E293B"/>
    </radialGradient></defs>
    <circle cx="11" cy="14" r="7" fill="url(#ibg)"/>
    <rect x="14" y="4" width="2" height="4" rx="1" fill="#A16207" transform="rotate(35 15 6)"/>
    <path d="M18 3l2 2-2 2" stroke="#F59E0B" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="19" cy="4" r="1.2" fill="#FBBF24"/>
  </svg>`,

  cell: `<svg viewBox="0 0 24 24" aria-hidden="true">
    <rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <path d="M3 9h18M3 15h18M9 3v18M15 3v18" stroke="#64748B" stroke-width="1" opacity=".5"/>
  </svg>`,

  iconPlus: `<svg viewBox="0 0 24 24" aria-hidden="true">
    <defs>
      <linearGradient id="plusGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#34D399"/>
        <stop offset="100%" stop-color="#047857"/>
      </linearGradient>
      <filter id="ps"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.4"/></filter>
    </defs>
    <rect x="2" y="2" width="20" height="20" rx="6" fill="url(#plusGrad)" filter="url(#ps)"/>
    <path d="M7 13l4 4 6-8" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`,

  iconMinus: `<svg viewBox="0 0 24 24" aria-hidden="true">
    <defs>
      <linearGradient id="minusGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#F87171"/>
        <stop offset="100%" stop-color="#991B1B"/>
      </linearGradient>
      <filter id="ms"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.4"/></filter>
    </defs>
    <rect x="2" y="2" width="20" height="20" rx="6" fill="url(#minusGrad)" filter="url(#ms)"/>
    <path d="M8 8l8 8M16 8l-8 8" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  </svg>`
};

class ProvablyFair {
  constructor(){ this.clientSeed = this.hex(16); this.nonce = 0; this.serverSeed = null; }
  hex(n){ const a = new Uint8Array(n); crypto.getRandomValues(a);
    return [...a].map(b=>b.toString(16).padStart(2,'0')).join(''); }
  async newRound(){ this.nonce++; this.serverSeed = this.hex(32); }
  async getMines(count){
    const enc = new TextEncoder();
    const key = await crypto.subtle.importKey("raw", enc.encode(this.serverSeed),
      {name:"HMAC", hash:"SHA-256"}, false, ["sign"]);
    const msg = enc.encode(`${this.clientSeed}:${this.nonce}`);
    let digest = new Uint8Array(await crypto.subtle.sign("HMAC", key, msg));
    let rb = digest, counter = 0;
    while(rb.length < TOTAL){
      counter++;
      const key2 = await crypto.subtle.importKey("raw", digest,
        {name:"HMAC", hash:"SHA-256"}, false, ["sign"]);
      const extra = new Uint8Array(await crypto.subtle.sign("HMAC", key2, enc.encode(String(counter))));
      const tmp = new Uint8Array(rb.length + extra.length);
      tmp.set(rb); tmp.set(extra, rb.length); rb = tmp;
    }
    const positions = [...Array(TOTAL).keys()];
    for(let i=TOTAL-1; i>0; i--){
      const j = rb[i] % (i+1);
      [positions[i], positions[j]] = [positions[j], positions[i]];
    }
    return new Set(positions.slice(0, count));
  }
}

const state = {
  balanceK: Math.round(INITIAL_BALANCE * 100),
  bet: 10.0,
  minesCount: 3,
  board: [],
  opened: new Set(),
  gameActive: false,
  busy: false,
  multiplier: 1.0,
  currentWin: 0.0
};
const pf = new ProvablyFair();

function fairMultiplier(opened, mines, total=TOTAL){
  if(opened <= 0) return 1.0;
  const safe = total - mines;
  let m = 1.0;
  for(let i=0; i<opened; i++) m *= (total - i) / (safe - i);
  return m;
}
const balanceRub = () => state.balanceK / 100;

const $ = id => document.getElementById(id);
const balanceEl = $("balance");
const betInput = $("betInput");
const minesVal = $("minesVal");
const actionBtn = $("actionBtn");
const autoBtn = $("autoBtn");
const resultLabel = $("resultLabel");
const infoStars = $("infoStars");
const infoRisk = $("infoRisk");
const infoOpened = $("infoOpened");
const historyEl = $("history");
const multRow = $("multRow");
const statBet = $("statBet");
const statWin = $("statWin");
const statNext = $("statNext");
const gridEl = $("grid");

const cells = [];
for(let r=0; r<5; r++){
  for(let c=0; c<5; c++){
    const cell = document.createElement("div");
    cell.className = "cell hidden";
    cell.dataset.r = r; cell.dataset.c = c;
    cell.innerHTML = ICONS.hidden;
    cell.addEventListener("click", () => revealCell(r,c));
    gridEl.appendChild(cell);
    cells.push(cell);
  }
}

const multEls = [];
for(let i=0; i<7; i++){
  const m = document.createElement("div");
  m.className = "m"; m.textContent = "";
  multRow.appendChild(m);
  multEls.push(m);
}

function updateBalance(){ balanceEl.textContent = balanceRub().toFixed(2) + " ₽"; }

function updateMultDisplay(currentStep){
  const totalSafe = TOTAL - state.minesCount;
  let start = currentStep > 0 ? Math.max(1, currentStep - 2) : 1;
  if(start + 6 > totalSafe) start = Math.max(1, totalSafe - 6);

  multEls.forEach((el, i) => {
    const step = start + i;
    if(step <= totalSafe){
      const m = fairMultiplier(step, state.minesCount);
      el.textContent = `x${m.toFixed(2)}`;
      el.className = "m";
      if(step < currentStep) el.classList.add("done");
      else if(step === currentStep) el.classList.add("current");
      el.style.visibility = "visible";
    } else {
      el.textContent = ""; el.className = "m";
      el.style.visibility = "hidden";
    }
  });
}

function updateInfoUI(){
  const opened = state.opened.size;
  const starsLeft = TOTAL - state.minesCount - opened;
  infoStars.innerHTML = `${ICONS.diamond} Звезд: ${starsLeft}`;
  const remaining = TOTAL - opened;
  const risk = remaining > state.minesCount ? (state.minesCount / remaining) * 100 : 0;
  infoRisk.innerHTML = `${ICONS.bomb} Риск: ${risk.toFixed(1)}%`;
  infoOpened.innerHTML = `${ICONS.cell} Открыто: ${opened}/25`;
}

function updateStatsPanel(){
  if(!state.gameActive) return;
  statBet.innerHTML = `ТЕКУЩАЯ СТАВКА<br>${state.bet.toFixed(2)} ₽`;
  statWin.innerHTML = `ВЫИГРЫШ<br>${state.currentWin.toFixed(2)} ₽`;
  const next = state.opened.size + 1;
  const maxSteps = TOTAL - state.minesCount;
  if(next <= maxSteps){
    const nm = fairMultiplier(next, state.minesCount);
    statNext.innerHTML = `СЛЕД. КЕФ<br>x${nm.toFixed(2)}`;
  } else {
    statNext.innerHTML = `СЛЕД. КЕФ<br>MAX`;
  }
}

const MAX_HISTORY = 50;
function addHistory(text, win){
  const div = document.createElement("div");
  div.className = "item";
  div.innerHTML = `${win ? ICONS.iconPlus : ICONS.iconMinus}<span>${text}</span>`;
  historyEl.prepend(div); // Новые записи строго сверху
  while(historyEl.children.length > MAX_HISTORY){
    historyEl.removeChild(historyEl.lastChild);
  }
}

function setResult(text, color){
  resultLabel.textContent = text;
  resultLabel.style.color = color;
}

function setMines(count){
  if(state.gameActive) return;
  state.minesCount = Math.max(1, Math.min(24, count));
  minesVal.textContent = state.minesCount;
  updateMultDisplay(0);
  updateInfoUI();
}

function blockControls(block){
  [betInput, $("btnMin"), $("btnHalf"), $("btnDouble"), $("btnMax"),
   $("mDec"), $("mInc"), ...document.querySelectorAll(".mines-btn")]
    .forEach(el => el.disabled = block);
}

function resetGameUI(){
  actionBtn.textContent = "НАЧАТЬ";
  actionBtn.className = "btn blue";
  betInput.disabled = false;
  setResult("Ожидание...", "var(--gray)");
  blockControls(false);
  updateBalance();
  updateMultDisplay(0);
  updateInfoUI();
  statBet.innerHTML = "ТЕКУЩАЯ СТАВКА<br>0.00 ₽";
  statWin.innerHTML = "ВЫИГРЫШ<br>0.00 ₽";
  statNext.innerHTML = "СЛЕД. КЕФ<br>x1.00";
  cells.forEach(c => { c.className = "cell hidden"; c.innerHTML = ICONS.hidden; });
}

async function startGame(){
  if(state.busy) return;
  const betVal = parseFloat(betInput.value);
  if(isNaN(betVal)){ setResult("Ошибка в ставке!", "var(--red)"); return; }
  if(betVal < MIN_BET){ setResult(`Мин. ставка: ${MIN_BET} ₽`, "var(--red)"); return; }
  if(betVal > balanceRub() + 1e-6){ setResult("Недостаточно средств!", "var(--red)"); return; }

  state.busy = true;
  state.bet = betVal;
  state.balanceK -= Math.round(betVal * 100);
  updateBalance();

  await pf.newRound();
  const minesSet = await pf.getMines(state.minesCount);
  state.board = new Array(TOTAL).fill(0);
  minesSet.forEach(i => state.board[i] = 1);

  state.opened.clear();
  state.currentWin = 0.0;
  state.multiplier = 1.0;
  state.gameActive = true;

  actionBtn.textContent = "ЗАБРАТЬ";
  actionBtn.className = "btn green";
  autoBtn.disabled = false;

  setResult("Игра идёт...", "var(--green)");
  blockControls(true);
  updateMultDisplay(0);
  updateInfoUI();
  updateStatsPanel();
  cells.forEach(c => { c.className = "cell hidden"; c.innerHTML = ICONS.hidden; });

  try{ localStorage.setItem(STORAGE_KEY, String(betVal)); }catch(e){}

  state.busy = false;
}

function revealCell(r, c){
  if(!state.gameActive) return;
  const idx = r*5 + c;
  if(state.opened.has(idx)) return;

  state.opened.add(idx);
  const cell = cells[idx];

  if(state.board[idx] === 1){
    cell.className = "cell dead";
    cell.innerHTML = ICONS.cross;
    state.currentWin = 0.0;
    gameOver(false);
  } else {
    cell.className = "cell safe";
    cell.innerHTML = ICONS.star;
    state.multiplier = fairMultiplier(state.opened.size, state.minesCount);
    state.currentWin = state.bet * state.multiplier;
    setResult(`Выигрыш: ${state.currentWin.toFixed(2)} ₽`, "var(--green)");
    updateInfoUI();
    updateMultDisplay(state.opened.size);
    updateStatsPanel();

    if(state.opened.size === TOTAL - state.minesCount) cashOut();
  }
}

function cashOut(){
  if(!state.gameActive || state.opened.size === 0) return;
  state.balanceK += Math.round(state.currentWin * 100);
  updateBalance();
  gameOver(true);
}

function gameOver(win){
  state.gameActive = false;
  for(let i=0; i<TOTAL; i++){
    if(!state.opened.has(i)){
      cells[i].className = "cell dead";
      cells[i].innerHTML = state.board[i] === 1 ? ICONS.cross : ICONS.star;
    }
  }
  if(win){
    setResult(`ВЫ ВЫИГРАЛИ: ${state.currentWin.toFixed(2)} ₽`, "var(--green)");
    addHistory(`Выигрыш: +${state.currentWin.toFixed(2)} ₽`, true);
  } else {
    setResult(`ВЗРЫВ! Потеряно: ${state.bet.toFixed(2)} ₽`, "var(--red)");
    addHistory(`Проигрыш: -${state.bet.toFixed(2)} ₽`, false);
  }
  actionBtn.textContent = "НАЧАТЬ";
  actionBtn.className = "btn blue";
  autoBtn.disabled = true;
  blockControls(false);
}

actionBtn.addEventListener("click", () => {
  if(state.gameActive) cashOut();
  else startGame();
});
autoBtn.addEventListener("click", () => {
  if(!state.gameActive) return;
  const avail = [...Array(TOTAL).keys()].filter(i => !state.opened.has(i));
  if(!avail.length) return;
  const pick = avail[Math.floor(Math.random() * avail.length)];
  revealCell(Math.floor(pick/5), pick%5);
});

$("btnMin").addEventListener("click", () => betInput.value = Math.max(MIN_BET, 1));
$("btnHalf").addEventListener("click", () => {
  const v = parseFloat(betInput.value) || 0;
  betInput.value = Math.max(MIN_BET, Math.min(v/2, MAX_BET)).toFixed(0);
});
$("btnDouble").addEventListener("click", () => {
  const v = parseFloat(betInput.value) || 0;
  betInput.value = Math.max(MIN_BET, Math.min(v*2, MAX_BET)).toFixed(0);
});
$("btnMax").addEventListener("click", () => {
  betInput.value = Math.max(1, Math.floor(balanceRub()));
});

$("mDec").addEventListener("click", () => setMines(state.minesCount - 1));
$("mInc").addEventListener("click", () => setMines(state.minesCount + 1));
document.querySelectorAll(".mines-btn").forEach(b => {
  b.addEventListener("click", () => setMines(+b.dataset.m));
});

try{
  const saved = localStorage.getItem(STORAGE_KEY);
  if(saved) betInput.value = saved;
}catch(e){}
resetGameUI();
</script>
</body>
</html>
